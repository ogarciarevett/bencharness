name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Reports and charts match the store
        run: |
          python -m bench.report
          git diff --exit-code RESULTS.md README.md docs/charts
          test -z "$(git ls-files --others --exclude-standard -- docs/charts)"
  clean-install:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Build the package in a clean container
        run: |
          python -m pip install build pipx uv
          python -m build
      - name: Install and verify isolated commands
        env:
          PIPX_HOME: /tmp/pipx
          PIPX_BIN_DIR: /tmp/pipx-bin
          UV_TOOL_DIR: /tmp/uv-tools
          UV_TOOL_BIN_DIR: /tmp/uv-bin
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -eu
          set -- dist/*.whl
          wheel="$PWD/$1"
          pipx install --python /usr/local/bin/python "$wheel"
          /tmp/pipx-bin/bench --help
          /tmp/pipx-bin/bench --version
          /tmp/pipx/venvs/bencharness/bin/python -c 'import os; from bench.safety import WRAPPER; assert WRAPPER.is_file() and os.access(WRAPPER, os.X_OK); assert (WRAPPER.parent.parent / "suites/rules/seeds/query-columns/manifest.json").is_file()'
          uv tool install --python /usr/local/bin/python "$wheel"
          /tmp/uv-bin/bench --help
          BENCHARNESS_PACKAGE="$wheel" XDG_DATA_HOME=/tmp/curl-data BENCHARNESS_BIN_DIR=/tmp/curl-bin sh install.sh
          /tmp/curl-bin/bench --version
          mkdir /tmp/report-workspace
          cp README.md /tmp/report-workspace/
          cp -R results /tmp/report-workspace/
          cd /tmp
          /tmp/pipx-bin/bench --report --workspace /tmp/report-workspace
          test -s /tmp/report-workspace/docs/charts/latest/summary.svg
          if /tmp/pipx-bin/bench --queue --workspace /tmp/report-workspace; then exit 1; fi
  homebrew-install:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install and test the pinned formula
        run: |
          brew tap-new --no-git local/bencharness
          cp Formula/bencharness.rb "$(brew --repository local/bencharness)/Formula/"
          brew install local/bencharness/bencharness
          brew test local/bencharness/bencharness
