name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Reports and charts match the store
        run: |
          python -m bench.report
          git diff --exit-code RESULTS.md README.md docs/charts
          test -z "$(git ls-files --others --exclude-standard -- docs/charts)"
