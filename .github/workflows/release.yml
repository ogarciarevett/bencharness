name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in pyproject.toml
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Verify version and build distributions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os,tomllib; assert os.environ["RELEASE_VERSION"] == tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
          python -m build
          sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/
            SHA256SUMS
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/bencharness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: .
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: false
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: .
      - name: Attach verified distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "v$RELEASE_VERSION" --target "$RELEASE_COMMIT" --generate-notes dist/* SHA256SUMS
