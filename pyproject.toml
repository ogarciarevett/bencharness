[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bencharness"
version = "0.1.0"
description = "Compare agent harnesses with scoped, recorded benchmark evidence"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://github.com/ogarciarevett/bencharness"
Issues = "https://github.com/ogarciarevett/bencharness/issues"

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*", "harnesses*", "suites*", "schedule"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]
schedule = ["codex-safe", "launcher.c"]

[tool.ruff.lint]
# SIM116: replace a chain of if/elif comparisons on one value with a dict lookup.
select = ["SIM116"]
